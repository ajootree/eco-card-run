<!doctype html>
<html lang="ko"><head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>에코 카드런</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap");

      :root {
        color-scheme: light;
        --forest: #31a66a;
        --forest-dark: #173f35;
        --water: #4d91e8;
        --sky: #bce9f4;
        --sun: #ffd66b;
        --coral: #ff8d86;
        --paper: #fffdf6;
        --ink: #203438;
        --muted: #587076;
        --line: rgba(32, 52, 56, 0.14);
        --wrong: #ee5e6b;
        --right: #27a467;
        --shadow: 0 18px 44px rgba(32, 81, 76, 0.18);
        --radius: 22px;
        --font-main: "Gowun Dodum", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        --font-display: "Jua", "Gowun Dodum", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          linear-gradient(rgba(255, 255, 255, 0.26) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.26) 1px, transparent 1px),
          linear-gradient(180deg, #d6f4f7 0%, #eefadf 100%);
        background-size: 32px 32px, 32px 32px, auto;
        color: var(--ink);
        font-family: var(--font-main);
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(180deg, transparent 0 76%, rgba(77, 166, 112, 0.09) 76% 100%);
      }

      button {
        border: 0;
        font: inherit;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 4px solid rgba(35, 103, 201, 0.38);
        outline-offset: 3px;
      }

      [hidden] {
        display: none !important;
      }

      .app {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: 100dvh;
        padding: 18px;
      }

      .game-shell {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 12px;
        width: min(1080px, 100%);
        min-height: calc(100dvh - 36px);
        margin: 0 auto;
      }

      .topbar {
        display: grid;
        grid-template-columns: minmax(180px, 1fr) auto auto;
        gap: 12px;
        align-items: center;
      }

      h1 {
        margin: 0;
        color: #214e42;
        font-family: var(--font-display);
        font-size: clamp(2rem, 4vw, 3.15rem);
        line-height: 1.05;
        letter-spacing: 0;
        text-shadow: 0 3px 0 rgba(255, 255, 255, 0.86);
      }

      .stats {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }

      .stat {
        display: grid;
        gap: 1px;
        min-width: 72px;
        padding: 8px 12px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.72);
        box-shadow: 0 6px 18px rgba(39, 89, 82, 0.11);
        text-align: center;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.76rem;
        font-weight: 800;
      }

      .stat strong {
        font-family: var(--font-display);
        font-size: 1.25rem;
        font-weight: 400;
        line-height: 1;
      }

      .game-shell:not(.is-playing) .stats,
      .game-shell:not(.is-playing) .controls,
      .game-shell:not(.is-playing) .life-hud {
        display: none;
      }

      .life-hud {
        position: absolute;
        z-index: 9;
        left: 18px;
        top: 18px;
        display: inline-flex;
        align-items: center;
        padding: 4px 6px;
      }

      .utility-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 7px;
        justify-content: flex-end;
      }

      .home-button,
      .sound-button {
        min-height: 42px;
        padding: 0 14px;
        border: 2px solid rgba(255, 255, 255, 0.92);
        border-radius: 999px;
        color: #29484c;
        font-weight: 800;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }

      .home-button {
        background: #fff3c7;
        box-shadow: 0 4px 0 #e7bb5b;
      }

      .sound-button {
        background: #d9f2ff;
        color: #26516b;
        box-shadow: 0 4px 0 #95cce5;
      }

      .sound-button[aria-pressed="false"] {
        background: #edf0f0;
        color: #4f4f4f;
        box-shadow: 0 4px 0 #bdc6c5;
      }

      .home-button:active,
      .sound-button:active {
        transform: translateY(2px);
        box-shadow: 0 2px 0 rgba(40, 76, 73, 0.24);
      }

      .stage-wrap {
        display: block;
        min-height: 0;
      }

      .stage {
        position: relative;
        min-height: clamp(420px, calc(100dvh - 228px), 552px);
        overflow: hidden;
        border: 4px solid rgba(255, 255, 255, 0.94);
        border-radius: 28px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent 28%),
          linear-gradient(180deg, #a9e4ef 0 38%, #8fd987 39% 100%);
        box-shadow: var(--shadow);
      }

      .stage::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -120px;
        width: min(70%, 620px);
        height: 112%;
        transform: translateX(-50%);
        clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%);
        background: linear-gradient(90deg, #79bca3, #b8d5ac 48%, #c8deb6 52%, #79bca3);
        box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.28);
      }

      .runner-card {
        position: absolute;
        z-index: 5;
        left: 50%;
        top: 48%;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 13px;
        align-items: center;
        min-width: min(74%, 340px);
        max-width: min(74%, 340px);
        padding: 15px 18px;
        border: 3px solid #31555a;
        border-radius: 26px;
        background: #fffdf7;
        box-shadow: 0 7px 0 #547a72, 0 18px 34px rgba(25, 65, 62, 0.22);
        transform: translate(-50%, -50%);
      }

      .runner-card.correct-burst {
        animation: correct-burst 420ms ease both;
      }

      .runner-card.correct-burst::after {
        content: "";
        position: absolute;
        inset: -22px;
        pointer-events: none;
        background:
          radial-gradient(circle, #ffffff 0 0.18rem, transparent 0.2rem) 14% 18% / 42px 42px,
          radial-gradient(circle, #fff176 0 0.22rem, transparent 0.24rem) 84% 24% / 46px 46px,
          radial-gradient(circle, #8eff5f 0 0.2rem, transparent 0.22rem) 78% 82% / 38px 38px,
          radial-gradient(circle, #ffffff 0 0.16rem, transparent 0.18rem) 24% 74% / 34px 34px;
        opacity: 0;
        animation: sparkle-pop 420ms ease both;
      }

      .runner-card.wrong-shake {
        animation: wrong-shake 420ms ease both;
      }

      .runner-card.card-back {
        background: #f5fbef;
        filter: saturate(0.82);
        pointer-events: none;
      }

      .runner-card.card-back.card-next {
        filter: saturate(0.88) blur(0.35px);
      }

      .runner-card.card-back.card-far {
        filter: saturate(0.66) blur(1.8px);
      }

      .runner-card.card-back.card-far strong {
        visibility: hidden;
      }

      .runner-card.card-back .icon {
        opacity: 0.72;
      }

      .runner-card.card-back strong {
        opacity: 0.72;
      }

      .runner-card .icon {
        display: grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 19px;
        border: 2px solid #5ca879;
        background: #ddf6dc;
        font-size: 2rem;
        overflow: hidden;
      }

      .runner-card .icon img {
        width: 100%;
        height: 100%;
        display: block;
      }

      .runner-card strong {
        font-family: var(--font-display);
        font-size: clamp(1.4rem, 2.8vw, 2.05rem);
        font-weight: 400;
        line-height: 1.05;
        text-align: left;
        word-break: keep-all;
      }

      .stage-toast {
        position: absolute;
        left: 50%;
        top: 22px;
        z-index: 7;
        min-width: min(68%, 300px);
        padding: 10px 16px;
        border: 2px solid rgba(49, 85, 90, 0.3);
        border-radius: 999px;
        background: #fffdf7;
        box-shadow: 0 8px 24px rgba(24, 69, 63, 0.18);
        color: var(--ink);
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 400;
        text-align: center;
        opacity: 0;
        transform: translate(-50%, -12px) scale(0.94);
        pointer-events: none;
      }

      .stage-toast.show {
        animation: toast-pop 760ms ease both;
      }

      .stage-toast.right {
        background: #daf7d7;
        color: #063719;
      }

      .stage-toast.wrong {
        background: #ffe3df;
        color: #671117;
      }

      .stage-toast.level {
        background: #fff1bd;
        color: #5a320d;
      }

      .countdown {
        position: absolute;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(17, 50, 32, 0.14);
        pointer-events: none;
      }

      .countdown-number {
        display: grid;
        place-items: center;
        min-width: clamp(120px, 22vw, 190px);
        aspect-ratio: 1;
        border: 5px solid #fffdf7;
        border-radius: 50%;
        background: linear-gradient(180deg, #fff3bc, #ffd06e);
        color: #4b2508;
        font-family: var(--font-display);
        font-size: clamp(4rem, 12vw, 8rem);
        line-height: 1;
        box-shadow: 0 10px 0 #b96f17, 0 22px 44px rgba(24, 37, 30, 0.32);
        animation: countdown-pop 850ms ease both;
      }

      .countdown-number.go {
        min-width: min(78vw, 360px);
        border-radius: 999px;
        padding: 0 clamp(18px, 3vw, 32px);
        aspect-ratio: auto;
        font-size: clamp(2.2rem, 7vw, 4.8rem);
        white-space: nowrap;
        color: #063719;
        background: linear-gradient(180deg, #d8ffc1, #84ef6f);
        box-shadow: 0 10px 0 #31a943, 0 22px 44px rgba(24, 37, 30, 0.32);
      }

      .stage.right-pulse {
        animation: stage-right-pulse 430ms ease both;
      }

      .stage.wrong-pulse {
        animation: stage-wrong-pulse 520ms ease both;
      }

      .overlay {
        position: absolute;
        z-index: 8;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 22px;
        background: rgba(40, 91, 82, 0.15);
        backdrop-filter: blur(4px);
      }

      .start-panel {
        width: min(650px, 100%);
        padding: 28px;
        border-radius: 28px;
        border: 3px solid rgba(255, 255, 255, 0.92);
        background: rgba(255, 253, 247, 0.96);
        box-shadow: 0 18px 48px rgba(31, 73, 67, 0.24);
      }

      .start-panel h2 {
        margin: 0 0 7px;
        color: #214e42;
        font-family: var(--font-display);
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        font-weight: 400;
        line-height: 1.1;
      }

      .start-panel p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
        word-break: keep-all;
      }

      .start-panel .primary {
        display: block;
        min-width: 168px;
        margin: 0 auto;
      }

      .tutorial-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
        margin: 20px 0 14px;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }

      .tutorial-card {
        min-height: 104px;
        padding: 16px 18px 16px 14px;
      }

      .tutorial-card + .tutorial-card {
        border-left: 1px solid var(--line);
        padding-left: 20px;
      }

      .tutorial-card strong {
        display: block;
        margin-bottom: 5px;
        color: #207c50;
        font-family: var(--font-display);
        font-size: 1.35rem;
        font-weight: 400;
      }

      .tutorial-card p {
        margin: 0;
        color: #53696d;
        font-size: 0.95rem;
      }

      .tutorial-card.nonlive strong {
        color: #3d78bd;
      }

      .tutorial-tip {
        margin: 0 0 18px;
        color: #6d6260;
        font-size: 0.9rem;
        font-weight: 800;
        text-align: center;
      }

      .mode-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .mode-buttons .primary {
        width: 100%;
        min-height: 70px;
        margin: 0;
      }

      .mode-buttons small {
        display: block;
        margin-top: 2px;
        font-family: var(--font-main);
        font-size: 0.82rem;
        font-weight: 800;
        opacity: 0.74;
      }

      .result-panel {
        text-align: center;
      }

      .result-panel h2 {
        margin-bottom: 16px;
        color: #214e42;
        font-family: var(--font-display);
        font-size: clamp(1.8rem, 5vw, 2.8rem);
        font-weight: 400;
      }

      .result-score {
        display: grid;
        place-items: center;
        min-height: 132px;
        width: min(420px, 100%);
        margin: 0 auto 18px;
        padding: 18px 22px;
        border: 2px solid rgba(67, 117, 106, 0.2);
        border-radius: 22px;
        background: #eff9e8;
        box-shadow:
          inset 0 0 0 4px rgba(255, 255, 255, 0.58),
          0 7px 0 #acd39a;
      }

      .result-score strong {
        color: #17361f;
        font-family: var(--font-display);
        font-size: clamp(1.45rem, 4.8vw, 2.55rem);
        font-weight: 400;
        line-height: 1.05;
      }

      .result-score span {
        display: block;
        margin-top: 10px;
        color: #6b512b;
        font-weight: 1000;
      }

      .result-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .result-actions .primary,
      .result-actions .secondary {
        width: 100%;
        min-height: 62px;
        margin: 0;
      }

      .primary.time-attack {
        background: #ffd5cf;
        color: #6c3534;
        box-shadow: 0 5px 0 #e69a94;
      }

      .primary,
      .secondary,
      .choice-button {
        min-height: 52px;
        border-radius: 20px;
        padding: 0 18px;
        font-family: var(--font-display);
        font-weight: 400;
        transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
      }

      .primary {
        background: #bcecbf;
        color: #174c32;
        box-shadow: 0 5px 0 #76be83;
      }

      .secondary {
        border: 2px solid #cad9d7;
        background: #f4f8f7;
        color: var(--forest-dark);
        box-shadow: 0 5px 0 #cad9d7;
      }

      .primary:hover,
      .secondary:hover,
      .choice-button:hover {
        filter: brightness(1.025) saturate(1.04);
        transform: translateY(-1px);
      }

      .hearts {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: #ff2549;
        letter-spacing: 0;
        white-space: nowrap;
        font-family: var(--font-display);
        font-size: clamp(2.25rem, 5vw, 3.5rem);
        line-height: 1;
        text-shadow:
          0 2px 0 #8d1325,
          0 5px 12px rgba(99, 0, 18, 0.34);
      }

      .hearts .empty {
        opacity: 1;
        color: #b6b2ad;
        filter: grayscale(0.2);
        text-shadow:
          0 2px 0 #716d68,
          0 4px 9px rgba(40, 35, 30, 0.18);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .choice-button {
        display: grid;
        gap: 3px;
        align-content: center;
        color: #18351e;
        text-align: center;
        min-height: 94px;
        border: 3px solid rgba(255, 255, 255, 0.92);
        font-size: clamp(1.55rem, 2.7vw, 2.05rem);
        text-shadow: 0 1px 0 rgba(255, 255, 255, 0.78);
      }

      .choice-button small {
        font-family: var(--font-main);
        font-size: 1rem;
        font-weight: 800;
        opacity: 0.74;
      }

      .choice-live {
        background: #c8efc8;
        color: #174021;
        box-shadow: 0 7px 0 #79bd83, 0 14px 28px rgba(38, 102, 67, 0.17);
      }

      .choice-nonlive {
        background: #cce9f8;
        color: #18355a;
        box-shadow: 0 7px 0 #82b9d9, 0 14px 28px rgba(44, 94, 130, 0.16);
      }

      .choice-button:active {
        transform: translateY(4px);
        box-shadow: 0 3px 0 rgba(70, 117, 105, 0.4);
      }

      @keyframes correct-burst {
        0% {
          transform: translate(-50%, -50%) scale(1);
          box-shadow: 0 9px 0 #8f5a2d, 0 20px 34px rgba(24, 37, 30, 0.24);
        }
        36% {
          transform: translate(-50%, -50%) scale(1.12);
          box-shadow: 0 9px 0 #208738, 0 0 0 12px rgba(142, 255, 95, 0.36), 0 24px 42px rgba(24, 37, 30, 0.28);
        }
        100% {
          transform: translate(-50%, -50%) scale(0.96);
          opacity: 0;
        }
      }

      @keyframes wrong-shake {
        0%,
        100% {
          transform: translate(-50%, -50%);
        }
        16% {
          transform: translate(calc(-50% - 18px), -50%) rotate(-2deg);
        }
        32% {
          transform: translate(calc(-50% + 18px), -50%) rotate(2deg);
        }
        48% {
          transform: translate(calc(-50% - 14px), -50%) rotate(-2deg);
          box-shadow: 0 9px 0 #8f2d2d, 0 0 0 10px rgba(223, 41, 53, 0.28), 0 20px 34px rgba(24, 37, 30, 0.24);
        }
        68% {
          transform: translate(calc(-50% + 10px), -50%) rotate(1deg);
        }
      }

      @keyframes sparkle-pop {
        0% {
          opacity: 0;
          transform: scale(0.7) rotate(-8deg);
        }
        36% {
          opacity: 1;
          transform: scale(1.08) rotate(3deg);
        }
        100% {
          opacity: 0;
          transform: scale(1.22) rotate(10deg);
        }
      }

      @keyframes stage-right-pulse {
        0%,
        100% {
          filter: none;
        }
        42% {
          filter: brightness(1.08) saturate(1.16);
        }
      }

      @keyframes stage-wrong-pulse {
        0%,
        100% {
          filter: none;
        }
        26%,
        56% {
          filter: sepia(0.22) saturate(1.4) hue-rotate(-22deg);
        }
      }

      @keyframes toast-pop {
        0% {
          opacity: 0;
          transform: translate(-50%, -10px) scale(0.92);
        }
        18%,
        82% {
          opacity: 1;
          transform: translate(-50%, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -10px) scale(0.96);
        }
      }

      @keyframes countdown-pop {
        0% {
          opacity: 0;
          transform: scale(0.6) rotate(-8deg);
        }
        20% {
          opacity: 1;
          transform: scale(1.08) rotate(2deg);
        }
        78% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.18) rotate(5deg);
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 940px) {
        .app {
          padding: 14px;
        }

        .game-shell {
          min-height: calc(100dvh - 28px);
        }

        .topbar {
          grid-template-columns: minmax(170px, 1fr) auto;
        }

        .utility-buttons {
          justify-content: flex-end;
        }

        .stats {
          grid-column: 1 / -1;
          justify-content: stretch;
        }

        .stat {
          flex: 1;
          min-width: 90px;
        }

        .life-hud {
          left: 14px;
          top: 14px;
        }
      }

      @media (max-width: 640px) {
        .app {
          padding: 10px;
        }

        .game-shell {
          gap: 10px;
          min-height: calc(100dvh - 20px);
        }

        .stage {
          min-height: 460px;
          border-width: 3px;
          border-radius: 22px;
        }

        .runner-card {
          min-width: min(78%, 300px);
          max-width: min(78%, 300px);
          padding: 12px 14px;
        }

        .runner-card .icon {
          width: 48px;
          height: 48px;
          font-size: 1.65rem;
        }

        .tutorial-grid {
          grid-template-columns: 1fr;
        }

        .tutorial-card {
          min-height: 0;
          padding: 13px 4px;
        }

        .tutorial-card + .tutorial-card {
          border-top: 1px solid var(--line);
          border-left: 0;
          padding-left: 4px;
        }

        .tutorial-tip {
          font-size: 0.84rem;
        }

        .mode-buttons {
          grid-template-columns: 1fr;
        }

        .result-actions {
          grid-template-columns: 1fr;
        }

        .start-panel {
          padding: 22px 18px;
        }

        .choice-button {
          min-height: 80px;
          padding: 0 10px;
          font-size: clamp(1.35rem, 6vw, 1.65rem);
        }

        .choice-button small {
          font-size: 0.9rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="game-shell" aria-labelledby="game-title">
        <header class="topbar">
          <div>
            <h1 id="game-title">에코 카드런</h1>
          </div>
          <div class="utility-buttons" aria-label="게임 도구">

      const els = {
        shell: document.querySelector(".game-shell"),
        stage: document.querySelector("#stage"),
        cardLayer: document.querySelector("#card-layer"),
        overlay: document.querySelector("#overlay"),
        toast: document.querySelector("#stage-toast"),
        countdown: document.querySelector("#countdown"),
        startButton: document.querySelector("#start-button"),
        timeStat: document.querySelector("#time-stat"),
        timeLeft: document.querySelector("#time-left"),
        homeButton: document.querySelector("#home-button"),
        soundButton: document.querySelector("#sound-button"),
        lives: document.querySelector("#lives"),
        level: document.querySelector("#level"),
        score: document.querySelector("#score"),
        combo: document.querySelector("#combo"),
        best: document.querySelector("#best"),
        chooseBiotic: document.querySelector("#choose-biotic"),
        chooseAbiotic: document.querySelector("#choose-abiotic"),
      };

      const state = {
        running: false,
        score: 0,
        combo: 0,
        maxCombo: 0,
        lives: 5,
        level: 1,
        mode: "endless",
        timeLeft: 60,
        timerId: null,
        countdownId: null,
        audioContext: null,
        soundOn: localStorage.getItem("classification-runner-sound") !== "off",
        locked: false,
        best: Number(localStorage.getItem("classification-runner-best") || 0),
        active: null,
        queue: [],
        round: 0,
      };

      function shuffle(list) {
        return [...list]
          .map((item) => ({ item, sort: Math.random() }))
          .sort((a, b) => a.sort - b.sort)
          .map(({ item }) => item);
      }

      function refillQueue() {
        while (state.queue.length < 8) {
          const available = playableCards();
          const biotic = shuffle(available.filter((card) => card.type === "biotic")).slice(0, 5);
          const abiotic = shuffle(available.filter((card) => card.type === "abiotic")).slice(0, 5);
          state.queue.push(...shuffle([...biotic, ...abiotic]));
        }
      }

      function playableCards() {
        return cards.filter((card) => card.level <= state.level);
      }

      function nextCard() {
        refillQueue();
        state.active = state.queue.shift();
        state.round += 1;
        renderCard();
      }

      function cardMarkup(card) {
        const element = document.createElement("div");
        element.className = "runner-card";
        element.innerHTML = `
          <span class="icon" aria-hidden="true"><img class="card-art" src="${clipArtSrc(card)}" alt="" /></span>
          <span>
            <strong>${card.name}</strong>
          </span>
        `;
        element.setAttribute("aria-label", `분류할 카드: ${card.name}`);
        return element;
      }

      function cardBackMarkup(card, index) {
        const element = document.createElement("div");
        element.className = `runner-card card-back ${index === 1 ? "card-next" : "card-far"}`;
        element.setAttribute("aria-hidden", "true");
        element.innerHTML = `
          <span class="icon" aria-hidden="true"><img class="card-art" src="${clipArtSrc(card)}" alt="" /></span>
          <span>
            <strong>${card.name}</strong>
          </span>
        `;
        const offsetY = 26 + (index - 1) * 26;
        const width = 316 - (index - 1) * 32;
        const widthPercent = 70 - (index - 1) * 8;
        const scaleY = 1 - index * 0.035;
        element.style.minWidth = `min(${widthPercent}%, ${width}px)`;
        element.style.maxWidth = `min(${widthPercent}%, ${width}px)`;
        element.style.transform = `translate(-50%, calc(-50% - ${offsetY}px)) scaleY(${scaleY})`;
        element.style.zIndex = String(5 - index);
        element.style.opacity = String(0.76 - index * 0.1);
        return element;
      }

      function clipArtSrc(card) {
        const bg = card.type === "biotic" ? ["#eaffd8", "#a8efb0"] : ["#e6f8ff", "#acdfff"];
        const art = artTemplates[card.art] || artTemplates.water;
        const svg = `
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
            <defs>
              <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
                <stop offset="0" stop-color="${bg[0]}"/>
                <stop offset="1" stop-color="${bg[1]}"/>
              </linearGradient>
            </defs>
            <rect width="120" height="120" rx="28" fill="url(#bg)"/>
            <circle cx="25" cy="24" r="16" fill="#ffffff" opacity="0.58"/>
            ${art}
          </svg>
        `;
        return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      }

      function renderCard() {
        els.cardLayer.innerHTML = "";
        if (!state.active) return;
        const backs = state.queue.slice(0, 4).map((card, index) => cardBackMarkup(card, index + 1));
        els.cardLayer.append(...backs.reverse(), cardMarkup(state.active));
      }

      function startGame(mode = "endless") {
        playSound("start");
        stopTimer();
        stopCountdown();
        state.running = true;
        state.mode = mode;
        state.score = 0;
        state.combo = 0;
        state.maxCombo = 0;
        state.lives = 5;
        state.level = 1;
        state.timeLeft = mode === "time" ? 60 : 0;
        state.locked = mode === "time";
        state.queue = [];
        state.round = 0;
        els.shell.classList.add("is-playing");
        els.overlay.hidden = true;
        document.activeElement?.blur();
        els.stage.scrollTop = 0;
        els.homeButton.hidden = false;
        clearToast();
        refillQueue();
        nextCard();
        renderStats();
        if (mode === "time") {
          startCountdown();
        } else {
          startTimer();
        }
      }

      function classify(choice) {
        if (!state.running || !state.active || state.locked) return;
        state.locked = true;
        const card = state.active;
        const correct = choice === card.type;
        const currentCard = els.cardLayer.querySelector(".runner-card:not(.card-back)");
        if (correct) {
          state.combo += 1;
          state.maxCombo = Math.max(state.maxCombo, state.combo);
          const bonus = Math.min(10, Math.floor(state.combo / 3) * 2);
          state.score += 10 + bonus;
          const leveledUp = updateLevel();
          playSound(leveledUp ? "level" : "correct");
          showToast(leveledUp ? "level" : "right", leveledUp ? `레벨 ${state.level}!` : "정답!");
          pulseStage("right-pulse");
          currentCard?.classList.add("correct-burst");
          window.setTimeout(() => {
            if (!state.running) return;
            state.locked = false;
            nextCard();
          }, 430);
        } else {
          state.combo = 0;
          state.lives = Math.max(0, state.lives - 1);
          playSound("wrong");
          showToast("wrong", "아쉬워!");
          pulseStage("wrong-pulse");
          currentCard?.classList.add("wrong-shake");
          if (state.lives <= 0) {
            window.setTimeout(() => {
              if (!state.running) return;
              state.locked = false;
              finishGame();
            }, 520);
          } else {
            window.setTimeout(() => {
              if (!state.running) return;
              state.locked = false;
              nextCard();
            }, 520);
          }
        }
        renderStats();
      }

      function showToast(kind, message) {
        els.toast.className = `stage-toast ${kind}`;
        els.toast.textContent = message;
        void els.toast.offsetWidth;
        els.toast.classList.add("show");
      }

      function pulseStage(className) {
        els.stage.classList.remove("right-pulse", "wrong-pulse");
        void els.stage.offsetWidth;
        els.stage.classList.add(className);
      }

      function clearToast() {
        els.toast.className = "stage-toast";
        els.toast.textContent = "";
      }

      function ensureAudio() {
        if (!state.soundOn) return null;
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!state.audioContext) {
          state.audioContext = new AudioContextClass();
        }
        if (state.audioContext.state === "suspended") {
          state.audioContext.resume();
        }
        return state.audioContext;
      }

      function tone(frequency, start, duration, type = "sine", volume = 0.08) {
        const audio = ensureAudio();
        if (!audio) return;
        const oscillator = audio.createOscillator();
        const gain = audio.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, audio.currentTime + start);
        gain.gain.setValueAtTime(0.0001, audio.currentTime + start);
        gain.gain.exponentialRampToValueAtTime(volume, audio.currentTime + start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + start + duration);
        oscillator.connect(gain);
        gain.connect(audio.destination);
        oscillator.start(audio.currentTime + start);
        oscillator.stop(audio.currentTime + start + duration + 0.03);
      }

      function playSound(name) {
        if (!state.soundOn) return;
        const patterns = {
          start: [
            [392, 0, 0.08, "triangle", 0.07],
            [523, 0.08, 0.11, "triangle", 0.07],
          ],
          count: [[520, 0, 0.08, "square", 0.045]],
          go: [
            [660, 0, 0.08, "triangle", 0.07],
            [880, 0.08, 0.16, "triangle", 0.075],
          ],
          correct: [
            [660, 0, 0.08, "triangle", 0.075],
            [880, 0.08, 0.12, "triangle", 0.075],
          ],
          wrong: [
            [220, 0, 0.12, "sawtooth", 0.055],
            [165, 0.1, 0.16, "sawtooth", 0.045],
          ],
          level: [
            [523, 0, 0.08, "triangle", 0.075],
            [659, 0.08, 0.08, "triangle", 0.075],
            [784, 0.16, 0.16, "triangle", 0.08],
          ],
          end: [
            [392, 0, 0.12, "triangle", 0.065],
            [330, 0.12, 0.12, "triangle", 0.06],
            [262, 0.24, 0.18, "triangle", 0.055],
          ],
          tap: [[440, 0, 0.05, "triangle", 0.04]],
        };
        const pattern = patterns[name];
        if (!pattern) return;
        if (!(window.AudioContext || window.webkitAudioContext) && window.Audio) {
          playFallbackSound(pattern);
          return;
        }
        pattern.forEach(([frequency, start, duration, type, volume]) => {
          tone(frequency, start, duration, type, volume);
        });
      }

      function playFallbackSound(pattern) {
        const sampleRate = 22050;
        const totalSeconds = Math.max(...pattern.map(([, start, duration]) => start + duration)) + 0.05;
        const sampleCount = Math.ceil(sampleRate * totalSeconds);
        const buffer = new ArrayBuffer(44 + sampleCount * 2);
        const view = new DataView(buffer);
        writeString(view, 0, "RIFF");
        view.setUint32(4, 36 + sampleCount * 2, true);
        writeString(view, 8, "WAVE");
        writeString(view, 12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(view, 36, "data");
        view.setUint32(40, sampleCount * 2, true);
        for (let index = 0; index < sampleCount; index += 1) {
          const now = index / sampleRate;
          let sample = 0;
          pattern.forEach(([frequency, start, duration, type, volume]) => {
            const local = now - start;
            if (local < 0 || local > duration) return;
            const fade = Math.min(1, local / 0.02, (duration - local) / 0.04);
            const wave = fallbackWave(type, frequency, local);
            sample += wave * volume * fade;
          });
          const value = Math.max(-1, Math.min(1, sample)) * 32767;
          view.setInt16(44 + index * 2, value, true);
        }
        const url = URL.createObjectURL(new Blob([buffer], { type: "audio/wav" }));
        const audio = new Audio(url);
        audio.addEventListener("ended", () => URL.revokeObjectURL(url), { once: true });
        audio.play().catch(() => URL.revokeObjectURL(url));
      }

      function fallbackWave(type, frequency, time) {
        const phase = 2 * Math.PI * frequency * time;
        if (type === "square") return Math.sign(Math.sin(phase));
        if (type === "sawtooth") return 2 * ((frequency * time) % 1) - 1;
        return Math.sin(phase);
      }

      function writeString(view, offset, text) {
        for (let index = 0; index < text.length; index += 1) {
          view.setUint8(offset + index, text.charCodeAt(index));
        }
      }

      function toggleSound() {
        state.soundOn = !state.soundOn;
        localStorage.setItem("classification-runner-sound", state.soundOn ? "on" : "off");
        updateSoundButton();
        playSound("tap");
      }

      function updateSoundButton() {
        els.soundButton.textContent = state.soundOn ? "소리 켬" : "소리 끔";
        els.soundButton.setAttribute("aria-pressed", String(state.soundOn));

      function renderStats() {
        els.lives.innerHTML = renderHearts(state.lives);
        els.lives.setAttribute("aria-label", `하트 ${state.lives}개`);
        els.timeStat.hidden = state.mode !== "time";
        els.timeLeft.textContent = state.mode === "time" ? `${state.timeLeft}` : "60";
        els.level.textContent = state.level;
        els.score.textContent = state.score;
        els.combo.textContent = state.combo;
        els.best.textContent = state.best;
      }

              </div>

                <strong>비생물요소</strong>
                <p>살아 있지 않지만 생물에게 영향을 주는 것<br />햇빛 · 물 · 흙 · 온도</p>
              </div>
            </div>
            <div class="tutorial-tip">처음에는 쉬운 카드부터! 점수가 오르면 새로운 환경이 열려요.</div>
            <div class="mode-buttons" aria-label="게임 모드 선택">

              <button class="primary time-attack" type="button" data-action="start" data-mode="time">
                60초 도전
                <small>1분 동안 빠르게 풀기</small>
              </button>
            </div>
          </div>
        `;
      }

      function showHome() {
        playSound("tap");
        stopCountdown();
        stopTimer();
        state.running = false;
        state.locked = false;
        state.score = 0;
        state.combo = 0;
        state.maxCombo = 0;
        state.lives = 5;
        state.level = 1;
        state.mode = "endless";
        state.timeLeft = 60;
        state.active = null;
        state.queue = [];
        state.round = 0;
        els.shell.classList.remove("is-playing");
        els.cardLayer.innerHTML = "";
        clearToast();
        renderStats();
        els.homeButton.hidden = true;
        els.overlay.innerHTML = tutorialMarkup();
        els.overlay.hidden = false;
        document.activeElement?.blur();
        els.stage.scrollTop = 0;
      }

      function renderHearts(count) {
        return Array.from({ length: 5 }, (_, index) => {
          const className = index < count ? "" : ' class="empty"';
          return `<span${className}>♥</span>`;
        }).join("");
      }

      function startCountdown() {
        stopCountdown();
        let count = 3;
        showCountdown(count);
        state.countdownId = window.setInterval(() => {
          count -= 1;
          if (count > 0) {
            showCountdown(count);
            return;
          }
          if (count === 0) {
            showCountdown("시작!");
            return;
          }
          stopCountdown();
          if (!state.running || state.mode !== "time") return;
          state.locked = false;
          startTimer();
        }, 900);
      }

      function showCountdown(value) {
        playSound(value === "시작!" ? "go" : "count");
        els.countdown.hidden = false;
        els.countdown.innerHTML = `<div class="countdown-number ${value === "시작!" ? "go" : ""}">${value}</div>`;
      }

      function stopCountdown() {
        if (state.countdownId) {
          window.clearInterval(state.countdownId);
          state.countdownId = null;
        }
        els.countdown.hidden = true;
        els.countdown.innerHTML = "";
      }

      function levelForScore(score) {
        return levelRules.reduce((current, rule) => (score >= rule.score ? rule.level : current), 1);
      }

      function updateLevel() {
        const nextLevel = levelForScore(state.score);
        if (nextLevel <= state.level) return false;
        state.level = nextLevel;
        return true;
      }

      function startTimer() {
        if (state.mode !== "time") return;
        state.timerId = window.setInterval(() => {
          state.timeLeft = Math.max(0, state.timeLeft - 1);
          renderStats();
          if (state.timeLeft <= 0) {
            finishGame("time");
          }
        }, 1000);
      }

      function stopTimer() {
        if (!state.timerId) return;
        window.clearInterval(state.timerId);
        state.timerId = null;
      }

      function finishGame(reason = "life") {
        if (!state.running) return;
        playSound("end");
        stopCountdown();
        stopTimer();
        state.running = false;
        state.best = Math.max(state.best, state.score);
        localStorage.setItem("classification-runner-best", String(state.best));
        saveRunResult();
        renderStats();
        els.shell.classList.remove("is-playing");
        els.homeButton.hidden = true;
        els.overlay.hidden = false;
        document.activeElement?.blur();
        els.stage.scrollTop = 0;
        els.overlay.innerHTML = `
          <div class="start-panel result-panel">
            <h2>게임 끝</h2>
            <div class="result-score" aria-label="내 점수 ${state.score}점">
              <strong>내 점수: ${state.score}점</strong>
              <span>최고 점수: ${state.best}점</span>
            </div>
            <div class="result-actions" aria-label="종료 후 선택">
              <button class="primary" id="restart-button" type="button" data-action="restart">다시하기</button>
              <button class="secondary" type="button" data-action="home">처음으로</button>
            </div>
          </div>
        `;
      }

      function restartGame() {
        startGame(state.mode);
      }

      function saveRunResult() {
        const key = "classification-runner-results";
        const previous = JSON.parse(localStorage.getItem(key) || "[]");
        previous.unshift({
          mode: state.mode,
          level: state.level,
          score: state.score,
          rounds: state.round,
          bestCombo: state.maxCombo,
          finishedAt: new Date().toISOString(),
        });
        localStorage.setItem(key, JSON.stringify(previous.slice(0, 30)));
      }

      function handleKeydown(event) {
        if (!state.running && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          startGame("endless");
          return;
        }
        if (["ArrowLeft", "a", "A"].includes(event.key)) {
          event.preventDefault();
          classify("biotic");
        }
        if (["ArrowRight", "d", "D"].includes(event.key)) {
          event.preventDefault();
          classify("abiotic");
        }
      }

      function handleButtonClick(event) {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const { action } = button.dataset;
        if (action === "start") {
          startGame(button.dataset.mode || "endless");
        }
        if (action === "restart") {
          restartGame();
        }
        if (action === "home") {
          showHome();
        }
        if (action === "sound") {
          toggleSound();
        }
        if (action === "classify") {
          classify(button.dataset.choice);
        }
      }

      Object.assign(window, {
        classify,
        restartGame,
        showHome,
        startGame,
        toggleSound,
      });

      document.addEventListener("click", handleButtonClick);
      window.addEventListener("keydown", handleKeydown);
      els.overlay.innerHTML = tutorialMarkup();
      els.homeButton.hidden = true;
      updateSoundButton();
      renderStats();
    </script>
  

</body></html>
